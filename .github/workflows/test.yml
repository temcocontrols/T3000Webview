name: Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check import paths match on-disk case
        run: npm run check:import-paths

      - name: Run client tests
        run: |
          npm ci
          npm run test:unit

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: i686-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-1.95.0-${{ hashFiles('api/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # The DLL is what actually ships; a broken cdylib must fail here, not at release time.
      - name: Build the 32-bit release DLL
        run: |
          cd api
          cargo build --release --target i686-pc-windows-msvc

      - name: Run webview api tests
        env:
          # Fail the build on any compiler warning. The ServiceLogger bug (async
          # `log()` called without `.await`, so every record was silently
          # dropped) sat behind an ignored `unused_must_use` warning; this makes
          # that class of defect fail CI instead of accumulating.
          RUSTFLAGS: "-D warnings"
        run: |
          cd api
          cargo test -- --test-threads 1
