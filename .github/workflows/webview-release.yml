name: Webview release

# Front-end release channel for T3000 Webview.
#
# Produces ONE downloadable package per release and attaches it to a GitHub
# Release. Nothing here installs anything or touches a T3000 installation - it
# only builds and publishes artifacts:
#
#   T3000-Webview-<version>.zip
#   └── <version>/
#         www/                  the web app (dist/ of the Quasar build)
#         t3web/                eez-studio runtime assets (ResourceFile\webview\t3web)
#         t3_webview_api.dll    the 32-bit Rust API
#         t3_webview_api.dll.lib
#         t3_webview_api.dll.exp
#         version.json          version + git sha + build time
#         sha256sums.txt
#
# The zip is also kept as a workflow artifact, and `latest.json` (a separate
# release asset) describes the newest build so a future updater can find it.
#
# Releases are cut from a tag on main, so every package maps to a commit.

on:
  push:
    tags: ['webview-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 26.1125.02'
        required: true
      notes:
        description: 'Release notes (markdown)'
        required: false
        default: ''

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 1. Guard: version + "must come from main" ───────────────────────────────
  guard:
    name: Guard
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      git_sha: ${{ steps.v.outputs.git_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#webview-v}"
          fi
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version '$V' is not YY.MMDD.NN (e.g. 26.1125.02)"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "git_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "release version: $V"

      - name: Release must come from main
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::dispatch a release from main (current ref: $GITHUB_REF)"
              exit 1
            fi
          else
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::tag $GITHUB_REF_NAME is not on main — merge first, then tag"
              exit 1
            fi
          fi

      - name: package.json version should match the tag
        run: |
          PKG=$(node -p "require('./package.json').version")
          norm() { printf '%s' "$1" | awk -F. '{printf "%d.%d.%d", $1, $2, $3}'; }
          if [ "$(norm "$PKG")" != "$(norm "${{ steps.v.outputs.version }}")" ]; then
            echo "::warning::package.json is $PKG but the release is ${{ steps.v.outputs.version }} — bump package.json so the two stay in step"
          fi

  # ── 2. Web app (same build as build.yml) ────────────────────────────────────
  ui:
    name: Build UI
    needs: guard
    runs-on: ubuntu-latest
    environment: build
    env:
      API_URL: ${{ secrets.API_URL }}
      API_WS_URL: ${{ secrets.API_WS_URL }}
      LOCAL_API_URL: ${{ vars.LOCAL_API_URL }}
      LOCAL_API_SECRET_KEY: ${{ secrets.LOCAL_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check import paths match on-disk case
        run: npm run check:import-paths

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Verify the build produced an app
        run: test -f dist/index.html

      - name: Upload www
        uses: actions/upload-artifact@v4
        with:
          name: webview-www
          path: dist
          if-no-files-found: error

  # ── 3. Rust API, 32-bit (same build as build.yml) ───────────────────────────
  api:
    name: Build API
    needs: guard
    runs-on: windows-latest
    environment: build
    env:
      API_URL: ${{ secrets.API_URL }}
      API_WS_URL: ${{ secrets.API_WS_URL }}
      LOCAL_API_URL: ${{ vars.LOCAL_API_URL }}
      LOCAL_API_SECRET_KEY: ${{ secrets.LOCAL_API_SECRET_KEY }}
      API_SECRET_KEY: ${{ secrets.LOCAL_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: i686-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-1.95.0-${{ hashFiles('api/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build webview api
        working-directory: api
        run: cargo build --target i686-pc-windows-msvc --release

      - name: Check the staged t3web resources
        id: t3web
        shell: pwsh
        run: |
          $p = "api/target/i686-pc-windows-msvc/release/ResourceFile/webview/t3web"
          if (Test-Path "$p/t3-eez") {
            $n = (Get-ChildItem $p -Recurse -File | Measure-Object).Count
            Write-Host "t3web staged: $n files"
            "found=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Warning "t3web resources were not staged (sibling repos missing) - the package will not include t3web/"
            "found=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Upload t3web
        if: steps.t3web.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: webview-t3web
          path: api/target/i686-pc-windows-msvc/release/ResourceFile/webview/t3web

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: webview-api
          if-no-files-found: error
          path: |
            api/target/i686-pc-windows-msvc/release/t3_webview_api.dll
            api/target/i686-pc-windows-msvc/release/t3_webview_api.dll.lib
            api/target/i686-pc-windows-msvc/release/t3_webview_api.dll.exp

  # ── 4. Assemble the package ─────────────────────────────────────────────────
  package:
    name: Package
    needs: [guard, ui, api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: webview-www
          path: .pkg/www

      - uses: actions/download-artifact@v4
        with:
          name: webview-api
          path: .pkg/api

      - name: Download t3web (optional)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: webview-t3web
          path: .pkg/t3web

      - name: Assemble <version>/ layout
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          GIT_SHA: ${{ needs.guard.outputs.git_sha }}
        run: |
          set -eu
          OUT="out/$VERSION"
          mkdir -p "$OUT"
          cp -r .pkg/www "$OUT/www"
          cp .pkg/api/t3_webview_api.dll "$OUT/"
          cp .pkg/api/t3_webview_api.dll.lib "$OUT/"
          cp .pkg/api/t3_webview_api.dll.exp "$OUT/"

          # eez-studio runtime assets -> ResourceFile\webview\t3web (lower case, as staged)
          if [ -d .pkg/t3web/t3-eez ]; then
            cp -r .pkg/t3web "$OUT/t3web"
            echo "t3web: $(find "$OUT/t3web" -type f | wc -l) files"
          else
            echo "::warning::t3web resources are not in this build — the zip will not contain t3web/"
          fi

          node -e '
            const fs = require("fs");
            const [out, version, sha, kinds] = process.argv.slice(1);
            const meta = {
              version,
              gitSha: sha,
              buildTime: new Date().toISOString(),
              kinds: JSON.parse(kinds),
            };
            const json = JSON.stringify(meta, null, 2) + "\n";
            fs.writeFileSync(`${out}/version.json`, json);
            // The running app can report its own version from /version.json
            fs.writeFileSync(`${out}/www/version.json`, json);
          ' "$OUT" "$VERSION" "$GIT_SHA" "$([ -d .pkg/t3web/t3-eez ] && echo '["ui","api","t3web"]' || echo '["ui","api"]')"

          # Manual-deploy instructions ride inside the package, so someone who
          # downloads the zip does not have to hunt through the release page.
          cat > "$OUT/DEPLOY.md" <<'DEPLOY_EOF'
          # T3000 Webview __VERSION__ — manual deployment

          This folder is **not** an installer. Copy three parts into an existing T3000
          installation. The default install root is `C:\Program Files (x86)\T3000`.

          ## Before you start

          - T3000 must already be installed.
          - **Close T3000 completely.** Windows keeps `t3_webview_api.dll` locked while
            it runs, so the copy fails with "file in use" otherwise.
          - Write with an **Administrator** shell or Explorer window — `Program Files`
            is protected.
          - Back up `ResourceFile\webview` and `T3000.exe` first.

          ## Copy

          | From this folder | To |
          | --- | --- |
          | `www\` | `C:\Program Files (x86)\T3000\ResourceFile\webview\www\` |
          | `t3web\` | `C:\Program Files (x86)\T3000\ResourceFile\webview\t3web\` |
          | `t3_webview_api.dll` | `C:\Program Files (x86)\T3000\` (next to `T3000.exe`) |

          Replace the existing `www` folder rather than merging into it, so removed
          files do not linger.

          ## Notes

          - `t3_webview_api.dll.lib` and `.exp` are link-time files for developers.
            They are **not** needed to run T3000 and can be ignored.
          - If this package has no `t3web\` folder, those runtime assets were not part
            of this build — leave any existing `ResourceFile\webview\t3web` untouched.
          - `www\version.json` is how the running app reports which build is deployed.
          - If you installed T3000 somewhere other than `Program Files (x86)\T3000`,
            map the paths above onto your install root.

          ## After copying

          Start T3000 and open WebView. Folders already present keep working; only the
          files above were replaced.

          `sha256sums.txt` lists the checksum of every file in this package.
          DEPLOY_EOF
          sed -i "s/__VERSION__/$VERSION/g" "$OUT/DEPLOY.md"

          ( cd "$OUT" && find . -type f -exec sha256sum {} + | sort -k2 > sha256sums.txt )
          ( cd out && zip -qr "../T3000-Webview-$VERSION.zip" "$VERSION" )

          ZIP_SHA=$(sha256sum "T3000-Webview-$VERSION.zip" | cut -d' ' -f1)
          ZIP_SIZE=$(du -h "T3000-Webview-$VERSION.zip" | cut -f1)

          # Release metadata for the future "Update Front End" button.
          node -e '
            const fs = require("fs");
            const [version, sha, size] = process.argv.slice(1);
            fs.writeFileSync("latest.json", JSON.stringify({
              version,
              url: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/webview-v${version}/T3000-Webview-${version}.zip`,
              sha256: sha,
              size,
              publishedAt: new Date().toISOString(),
              kinds: ["ui", "api"],
            }, null, 2) + "\n");
          ' "$VERSION" "$ZIP_SHA" "$ZIP_SIZE"

          {
            echo "### T3000 Webview $VERSION"
            echo ""
            echo "| file | value |"
            echo "|---|---|"
            echo "| T3000-Webview-$VERSION.zip | $ZIP_SIZE |"
            echo "| sha256 | \`$ZIP_SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: webview-package
          if-no-files-found: error
          path: |
            T3000-Webview-*.zip
            latest.json

  # ── 5. Publish ──────────────────────────────────────────────────────────────
  publish:
    name: Publish
    needs: [guard, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: webview-package
          path: pkg

      - name: Attach to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: webview-v${{ needs.guard.outputs.version }}
          name: T3000 Webview ${{ needs.guard.outputs.version }}
          body: |
            Front-end release `${{ needs.guard.outputs.version }}`

            Download **T3000-Webview-${{ needs.guard.outputs.version }}.zip** below.
            `latest.json` describes this build (version, sha256, download URL).

            ## Updating a machine by hand

            The zip is **not** an installer. Copy three parts into an existing T3000
            installation — default root `C:\Program Files (x86)\T3000`. T3000 must
            already be installed, T3000 must be **closed** (Windows locks the DLL
            while it runs), and you need an **Administrator** shell. Back up
            `ResourceFile\webview` first.

            | From the zip | Copy to |
            | --- | --- |
            | `www\` | `C:\Program Files (x86)\T3000\ResourceFile\webview\www\` |
            | `t3web\` | `C:\Program Files (x86)\T3000\ResourceFile\webview\t3web\` |
            | `t3_webview_api.dll` | `C:\Program Files (x86)\T3000\` (next to `T3000.exe`) |

            Replace the existing `www` folder rather than merging into it. Then start
            T3000 and open WebView.

            `t3_webview_api.dll.lib` and `.exp` are link-time files — not needed to run.
            If the zip has no `t3web\`, leave your existing `ResourceFile\webview\t3web`
            alone.

            Full instructions are in **`DEPLOY.md`** inside the zip. To verify the
            download, `sha256sums.txt` covers every file and the zip's own sha256 is in
            `latest.json`.

            ${{ github.event.inputs.notes }}
          files: |
            pkg/T3000-Webview-*.zip
            pkg/latest.json
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
